plugins {
  id 'com.github.johnrengelman.shadow' version '7.0.0'
}


apply from: "https://raw.githubusercontent.com/toolarium/common-gradle-build/master/gradle/common.gradle"


/***************************************************************************************
 * Suppress obsolete source/target compatibility warnings
 ***************************************************************************************/
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:-options'
}


/***************************************************************************************
 * define the main class name
 ***************************************************************************************/
application {
    mainClass = "com.github.toolarium.changelog.main.ChangelogMain"
}


/****************************************************************************************
 * Define project dependencies
 ****************************************************************************************/
dependencies {
    // utilities
    implementation "com.github.toolarium:toolarium-common:1.1.0"
    implementation "com.github.toolarium:toolarium-ansi:0.9.1"
}
